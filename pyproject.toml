[project]
name = "micropcb"
version = "0.1.0"
description = "Control software for Wegstr CNC machines, focused on PCB milling"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
micropcb = "micropcb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
