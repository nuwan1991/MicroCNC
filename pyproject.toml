[project]
name = "micropcb"
version = "0.2.6"
description = "Control software for Wegstr CNC machines, focused on PCB milling"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5", "PySide6>=6.6", "numpy>=1.26", "pyqtgraph>=0.13", "PyOpenGL>=3.1", "shapely>=2.0", "opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
micropcb = "micropcb.cli:main"

[project.gui-scripts]
micropcb-cam = "micropcb.apps.cam:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
